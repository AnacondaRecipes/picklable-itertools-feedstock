{% set name = "picklable-itertools" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: faecb7709d2684f3d2d06032e06ed0670cacc59cc074adccd666291c848fe638

build:
  number: 2
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv "

requirements:
  host:
    - python
    - pip
    - setuptools
    - six
  run:
    - python
    # picklable_itertools imports pkg_resources; setuptools 80 and later no
    # longer ship it, so keep the runtime dependency below 80. 78.1.1 is the
    # newest matching build and has a native py315 package.
    - setuptools <80
    - six

test:
  requires:
    - pip
  imports:
    - picklable_itertools
  commands:
    - pip check

about:
  home: https://github.com/mila-udem/picklable-itertools
  license: MIT
  license_family: MIT
  summary: itertools, but picklable
  description: |
    Picklable variants of the itertools building blocks, so that iterators can be
    serialized and sent to worker processes.
  doc_url: https://github.com/mila-udem/picklable-itertools#readme
  dev_url: https://github.com/mila-udem/picklable-itertools

extra:
  recipe-maintainers:
    - jjhelmus
